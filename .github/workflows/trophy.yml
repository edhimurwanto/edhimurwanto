name: Update GitHub Profile Trophy

on:
  workflow_dispatch:

  schedule:
    # Every Sunday at 00:17 UTC
    - cron: "17 0 * * 0"

permissions:
  contents: write

concurrency:
  group: github-profile-trophy
  cancel-in-progress: true

jobs:
  generate:
    name: Generate trophy.svg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Clone GitHub Profile Trophy
        run: |
          git clone --depth 1 https://github.com/ryo-ma/github-profile-trophy.git .github-profile-trophy

      - name: Generate trophy.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .github-profile-trophy

          deno run \
            --allow-net \
            --allow-env \
            --allow-read \
            --allow-write \
            ./render_svg.ts \
            edhimurwanto \
            ../trophy.svg \
            flat

      - name: Remove generator
        run: |
          rm -rf .github-profile-trophy

      - name: Commit trophy.svg
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to trophy.svg"
            exit 0
          fi

          git commit -m "chore: update GitHub profile trophy"
          git push
