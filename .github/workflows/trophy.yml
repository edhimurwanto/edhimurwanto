name: Update GitHub Profile Trophy

on:
  # Allow manual execution from the Actions tab
  workflow_dispatch:

  # Update once a week
  schedule:
    - cron: "17 0 * * 0"

permissions:
  contents: write

concurrency:
  group: profile-trophy
  cancel-in-progress: true

jobs:
  generate:
    name: Generate trophy.svg
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate GitHub Profile Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: edhimurwanto
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg

          if git diff --cached --quiet; then
            echo "No trophy changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile trophy"
          git push
